server:
  port: 8080
  servlet.context-path: /

spring:
  profiles.active: "prod"
  flyway:
    locations: ["classpath:/db/migration"]
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: "false"
    open-in-view: true
    properties.hibernate.jdbc.time_zone: "GMT+1"
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jackson:
    datatype.datetime.adjust-dates-to-context-time-zone: true
    deserialization.fail-on-null-for-primitives: false
    time-zone: "Europe/Zurich"
  mail:
    enabled: ${MAIL_ENABLED}
    username: ${MAIL_USER}
    password: ${MAIL_PASSWORD}
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    templates.path: "mail-templates"
    properties.mail.smtp:
      auth: "true"
      starttls.enable: "true"
    simulate: ${SIMULATE_ENABLED}
    simulateemail: ${SIMULATE_EMAIL}
  thymeleaf.prefix: "classpath:/mail-templates/"
  application.name: ztv-anmeldetool
  cloud.config:
    # this info may be accessed via actuator
    info.app:
      name: Anmeldetool
      version: "@version@"
      buildtime: "@timestamp@"

logging.level.org:
  springframework:
    cloud: INFO
    security: INFO
    web.cors: INFO
  flywaydb: INFO
  hibernate.SQL: INFO
  ztv.anmeldetool.service: INFO

# JWT Configuration
# Supply a unique Base64-encoded signing key of at least 256 bits through JWT_SECRET.
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 # 24 hours in milliseconds

scheduler:
  reminder:
    cron: "0 0 1 * * ?"
    daysbefore: 3
  closed:
    cron: "0 0 2 * * ?"
    daysafter: 1
  mutationen:
    cron: "0 0 3 * * ?"
    daysbefore: 3
  published.cron: "0 0 4 * * ?"

management:
  endpoints.web.cors:
    path-mappings: /**
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
    allowed-methods: GET, POST, PUT
    allowed-headers: "*"
  server.base-path: /admin
  endpoint:
    beans.access: read-only
    health.access: read-only
    info.access: read-only