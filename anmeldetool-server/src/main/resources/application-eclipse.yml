server:
  port: ${BACKEND_PORT}
  servlet:
    context-path: /
spring:
  flyway:
    locations: ["classpath:/db/migration"]
  jpa:
     database-platform: org.hibernate.dialect.PostgreSQLDialect
     show-sql: "false"
     properties:
        hibernate:
           jdbc:
              # time_zone: "Europe/Zurich"
              time_zone: "GMT+1"
  jackson:
     deserialization:
        adjust-dates-to-context-time-zone: true
     # time-zone: "Europe/Zurich"
     time-zone: "UTC"
  mail:
    enabled: ${MAIL_ENABLED}
    username:  ${MAIL_USER}
    password: ${MAIL_PASSWORD}
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    simulate:  ${SIMULATE_ENABLED}
    simulateemail: ${SIMULATE_EMAIL}


# this info may be accessed via actuator
info:
  app:
    name: Anmeldetool
    version: "@version@"
    buildtime: "@timestamp@"
    web: "https://ztv-anmeldetool.duckdns.org/ztv-anmeldetool"

logging:
  level:
    org.springframework.cloud: INFO
    org.springframework.security: INFO
    org.flywaydb: INFO
    org.springframework.web.cors: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type: WARN
    org.ztv.anmeldetool: INFO
# Sec Min Hours Day_of_Month Month Day_of_week Year
scheduler:
    riegenaufteilung:
      cron: "20 * * * * *"
      daysbefore: 24
    reminder:
      cron: "0/10 1 * * 12 *"
      daysbefore: 3
    closed:
      cron: "0/10 1 * * 12 *"
      daysafter: 1
    mutationen:
      cron: "0/10 1 * * 12 *"
      daysbefore: 3
    published:
      cron: "0/10 1 * * 12 *" 
      
management:
  endpoints:
    web:
      cors:
        path-mappings: /**
        allowed-origins: ${CORS_ALLOWED_ORIGINS}
        allowed-methods: GET, POST, PUT
        allowed-headers: "*"
  server:
      base-path: /admin
  endpoint:
    beans:
      enabled: true
    health:
      enabled: true
    info:
      enabled: true
