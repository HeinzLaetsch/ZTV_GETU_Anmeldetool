{{- $fullName := print (include "ztv-anmeldetool.fullname" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-jwt-secret
  namespace: ztv
type: Opaque
stringData:
  JWT_SECRET: {{ required "backend.jwt.secret must be set to a base64-encoded key of at least 256 bits" .Values.backend.jwt.secret | quote }}
