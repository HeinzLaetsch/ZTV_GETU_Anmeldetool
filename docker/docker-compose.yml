services:
  db:
    image: postgres
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql
    env_file:
      - database.env
    ports:
      - 5432:5432

  pgadmin:
    container_name: pgadmin4
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: heinz.laetsch@gmx.ch
      PGADMIN_DEFAULT_PASSWORD: adrian2000
    ports:
      - "5050:80"
secrets:
    docker_secrets:
      file: ./docker_secrets.properties
volumes:
  postgres_data:

