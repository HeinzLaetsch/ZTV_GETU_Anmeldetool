<ng-container *ngIf="laufliste">
  <div class="layout-col label">Laufliste</div>
  <div class="layout-col data">{{ laufliste.laufliste }}</div>
  <div class="layout-col label">Gerät</div>
  <div class="layout-col data">{{ laufliste.geraet }}</div>
  <div class="layout-col label">Abteilung</div>
  <div class="layout-col data">
    {{ laufliste.abteilung.substring(laufliste.abteilung.indexOf('_') + 1) }}
  </div>
  <div class="layout-col label">Anlage</div>
  <div class="layout-col data">
    {{ laufliste.anlage.substring(laufliste.anlage.indexOf('_') + 1) }}
  </div>
  <div class="layout-col label">Wechsel</div>
  <div class="layout-col data">
    {{ laufliste.abloesung }}
  </div>
</ng-container>
