<div class="banner">
  <mat-button-toggle-group
    #group="matButtonToggleGroup"
    name="geschlecht"
    aria-label="Geschlecht"
    [value]="selectedState()"
    (click)="onClick(group.value)"
    localeText="localeTextDE"
  >
    <mat-button-toggle value="Turnerin">Turnerinnen</mat-button-toggle>
    <mat-button-toggle value="Turner">Turner</mat-button-toggle>
  </mat-button-toggle-group>
  <span class="abstand">
    <mat-checkbox class="checkbox" [checked]="showOldAnlaesse()" (change)="onShowOldAnlaesseChange($event.checked)"
      >vergangene Wettkämpfe anzeigen</mat-checkbox
    >
  </span>
</div>
<div>
  <button
    mat-fab
    class="mat-fab-pos1"
    color="primary"
    #tooltip="matTooltip"
    matTooltip="Neue TurnerIn anlegen"
    matTooltipPosition="below"
    matTooltipHideDelay="500"
    (click)="addRow()"
  >
    Neu
  </button>
</div>
<div>
  <button
    mat-fab
    class="mat-fab-pos2"
    color="primary"
    #tooltip="matTooltip"
    matTooltip="Hilfe"
    matTooltipPosition="below"
    matTooltipHideDelay="500"
    (click)="openTeilnehmerGridHelp()"
  >
    Hilfe
  </button>
</div>
<ag-grid-angular
  class="teilnehmer-grid"
  [theme]="gridTheme"
  [getRowId]="getRowId"
  [defaultColDef]="defaultColDef"
  [suppressColumnVirtualisation]="true"
  [context]="context"
  [rowData]="rowData()"
  [rowSelection]="{ mode: 'multiRow', checkboxes: false, headerCheckbox: false }"
  [animateRows]="true"
  [pagination]="true"
  [paginationAutoPageSize]="true"
  (gridReady)="onGridReady($event)"
  [readOnlyEdit]="false"
  [tooltipShowDelay]="tooltipShowDelay"
></ag-grid-angular>
