<div class="layout-container">
  <!--form [formGroup]="form" (submit)="save()"-->
  <form [formGroup]="form">
    <h1>Neuen Vereinsanmelder beantragen</h1>
    <hr />
    <mat-dialog-content>
      <p>
        <mat-form-field appearance="fill">
          <mat-label>Verein</mat-label>
          <mat-select [formControl]="form.controls['vereinFormControl']">
            <mat-option value=""></mat-option>
            @for (verein of vereine(); track verein.id) {
              <mat-option [value]="verein.id">
                {{ verein.name }}
              </mat-option>
            }
          </mat-select>
          @if (form.controls['vereinFormControl'].hasError('required')) {
            <mat-error> Pflichtfeld </mat-error>
          }
          <mat-hint>Wähle Deinen Verein aus</mat-hint>
        </mat-form-field>
      </p>
      <lxt-user
        [user]="anmelder()"
        (userChange)="updateAnmelder($event)"
        (valid)="updateUserValid($event)"
        [showPassword]="true"
        [showBenutzername]="false"
        [mustShowPassword]="true"
      ></lxt-user>
    </mat-dialog-content>
    @if (error()) {
      <mat-error class="error"> {{ errorMessage() }}</mat-error>
    }
    <button mat-button type="button" (click)="cancel()">Abbrechen</button>
    <button mat-button type="submit" [disabled]="!form.valid || !userValid()" (click)="save()">Speichern</button>
  </form>
</div>
