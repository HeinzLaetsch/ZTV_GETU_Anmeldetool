<div class="layout-container-fluid">
  <div class="layout-row">
    <div class="layout-col-6">
      <ztv-user
        [modify]="true"
        [readOnly]="isReadOnly()"
        [user]="currentUser()"
        [showPassword]="isOwner()"
        [showBenutzername]="true"
        [mustShowPassword]="false"
        (userChange)="onUserChange($event)"
        (valid)="updateUserValid($event)"
      ></ztv-user>
    </div>
    <div class="layout-col-6" [hidden]="isUserDirty()">
      <ztv-role
        [currentUser]="currentUser()"
        [isVereinsAnmelder]="isVereinsAnmelder()"
        [isVereinsVerantwortlicher]="isVereinsVerantwortlicher()"
        [assignedRoles]="assignedRoles()"
        (assignedRolesChange)="onAssignedRolesChange($event)"
      >
      </ztv-role>
      @if (isWertungsrichter()) {
        <ztv-wertungsrichter
          [currentUser]="currentUser()"
          [wertungsrichter]="wertungsrichter()"
          [isVereinsAnmelder]="isVereinsAnmelder()"
          [isVereinsVerantwortlicher]="isVereinsVerantwortlicher()"
          (wertungsrichterChange)="onWertungsrichterChange($event)"
        ></ztv-wertungsrichter>
      }
    </div>
  </div>
</div>
