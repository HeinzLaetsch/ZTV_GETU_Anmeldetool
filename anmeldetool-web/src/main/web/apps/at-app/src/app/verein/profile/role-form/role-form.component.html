<ng-container>
  <h1 class="label">Rollen</h1>
  <div class="layout-container-fluid">
    <div class="layout-row">
      <div class="layout-col">
        <h2>verfügbare Rollen</h2>
      </div>
      <div class="layout-col">
        <h2>zugewiesene Rollen</h2>
      </div>
    </div>
    <div class="layout-row">
      <div
        cdkDropList
        #allRolesList="cdkDropList"
        [cdkDropListData]="allRoles"
        [cdkDropListConnectedTo]="[assignedRolesList]"
        class="drag-drop-list layout-col"
        (cdkDropListDropped)="drop($event)"
      >
        @for (role of allRoles; track role.name) {
          <div class="drag-drop-box" cdkDrag [cdkDragDisabled]="disableRole(role)">
            <ztv-role-chip [role]="role" [isAllRolesList]="true"></ztv-role-chip>
          </div>
        }
      </div>
      <div
        cdkDropList
        #assignedRolesList="cdkDropList"
        [cdkDropListData]="assignedRoles()"
        [cdkDropListConnectedTo]="[allRolesList]"
        class="drag-drop-list layout-col"
        (cdkDropListDropped)="drop($event)"
      >
        @for (role of assignedRoles(); track role.name) {
          <div class="drag-drop-box" cdkDrag [cdkDragDisabled]="disableRole(role)">
            <ztv-role-chip
              [role]="role"
              [isAllRolesList]="false"
              [isVereinsVerantwortlicher]="isVereinsAnmelder()"
              [isVereinsAnmelder]="isVereinsAnmelder()"
              (roleChange)="aktivChange($event)"
            ></ztv-role-chip>
          </div>
        }
      </div>
    </div>
  </div>
</ng-container>
