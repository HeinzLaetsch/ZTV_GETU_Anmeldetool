@if (einsatz(); as currentEinsatz) {
  <div class="slot">
    <mat-checkbox
      [class.label-green]="currentEinsatz.eingesetzt"
      [class.label-red]="!currentEinsatz.eingesetzt"
      [checked]="currentEinsatz.eingesetzt"
      [disabled]="!canEdit()"
      (change)="userEingesetztChange($event)"
      >{{ slotText() }}</mat-checkbox
    >
  </div>
} @else {
  <div class="center">
    <mat-spinner style="margin: 0 auto"></mat-spinner>
  </div>
}
