<mat-accordion>
  <ztv-kategorie-status
    *ngFor="let kategorie of getKategorien()"
    [anlass]="anlass()"
    [kategorie]="kategorie"
    [erfasstChangedEmitter]="erfasstChangedEmitter()"
    [checkedChangedEmitter]="checkedChangedEmitter()"
    (lauflisteSelectedEvent)="lauflisteSelected($event)"
  ></ztv-kategorie-status>
</mat-accordion>
