<div
  class="chip"
  #tooltip="matTooltip"
  matTooltip="Ziehe (Drag & Drop) die Rolle rüber"
  matTooltipPosition="above"
  matTooltipHideDelay="200"
>
  @if (isAllRolesList()) {
    <span>{{ role().name }}</span>
  } @else {
    <span [class.label-green]="role().aktiv" [class.label-red]="!role().aktiv">{{ role().name }}</span>
    <br />
    <mat-checkbox
      [class.label-green]="role().aktiv"
      [class.label-red]="!role().aktiv"
      [(ngModel)]="role().aktiv"
      [disabled]="!isVereinsVerantwortlicher()"
      (ngModelChange)="onAktivChange()"
      >Rolle ist aktiviert</mat-checkbox
    >
  }
</div>
