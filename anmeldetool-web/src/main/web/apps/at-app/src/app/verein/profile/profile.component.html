@if (users().length > 0) {
  <div class="layout-container-fluid">
    <div class="layout-row">
      <div class="layout-col-12">
        <h1 class="label">Vereinsadministration {{ verein().name }}</h1>
      </div>
    </div>
    <div class="layout-row">
      <div class="layout-col-12">
        <mat-tab-group mat-align-tabs="start" #tabs>
          @for (user of vereinsUsers(); track user.id; let i = $index) {
            <mat-tab>
              <ng-template mat-tab-label>
                <span [class.unsafed]="hasUnsavedWork(i)">{{ getTabName(user.benutzername, i) }}</span>
              </ng-template>
              <ztv-user-form
                [currentUser]="user"
                [userDirty]="hasUnsavedWork(i)"
                [tabIndex]="i"
                (userChange)="userChange($event)"
              ></ztv-user-form>
            </mat-tab>
          }
        </mat-tab-group>
      </div>
    </div>
  </div>
} @else {
  <p>Loading...</p>
}
<button
  mat-fab
  class="mat-fab-pos1"
  color="primary"
  #tooltip="matTooltip"
  matTooltip="Neuen Benutzer anlegen"
  matTooltipPosition="below"
  matTooltipHideDelay="500"
  (click)="addUser()"
>
  Neu
</button>
<button
  mat-fab
  class="mat-fab-pos2"
  color="primary"
  [disabled]="!hasChanges()"
  #tooltip="matTooltip"
  matTooltip="Änderungen verwerfen"
  matTooltipPosition="below"
  matTooltipHideDelay="500"
  (click)="cancelUser()"
>
  Verwerfen</button
><button
  mat-fab
  class="mat-fab-pos3"
  color="primary"
  [disabled]="!hasChanges() || !isValid()"
  #tooltip="matTooltip"
  matTooltip="Änderungen speichern"
  matTooltipPosition="below"
  matTooltipHideDelay="500"
  (click)="saveUser()"
>
  Speichern
</button>
