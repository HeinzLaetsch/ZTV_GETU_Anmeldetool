@if (anlass; as currentAnlass) {
  <div class="layout-col-12">
    <mat-tab-group #tabs mat-align-tabs="start">
      <mat-tab>
        <ng-template mat-tab-label>Erfassen</ng-template>
        <ng-template matTabContent>
          <ztv-erfassen [anlass]="currentAnlass" [modeErfassen]="true"></ztv-erfassen>
        </ng-template>
      </mat-tab>
      <mat-tab>
        <ng-template mat-tab-label>Überprüfen</ng-template>
        <ng-template matTabContent>
          <ztv-erfassen [anlass]="currentAnlass" [modeErfassen]="false"></ztv-erfassen>
        </ng-template>
      </mat-tab>
      @if (authService.isAdministrator()) {
        <mat-tab>
          <ng-template mat-tab-label>Ranglisten</ng-template>
          <ng-template matTabContent>
            <ztv-ranglisten></ztv-ranglisten>
          </ng-template>
        </mat-tab>
      }
    </mat-tab-group>
    <div class="anlass-title">
      <h2>{{ currentAnlass.getWithDatum() }}</h2>
    </div>
  </div>
} @else {
  <p class="loading-message">Anlass wird geladen...</p>
}
