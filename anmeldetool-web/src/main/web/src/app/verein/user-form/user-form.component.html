<div class="container-fluid">
  <div class="row">
    <div class="col-6">
      <lxt-user
        [modify]="true"
        [readOnly]="!(isOwner() || isVereinsAnmelder || isVereinsVerantwortlicher)"
        [(user)]="currentUser"
        [showPassword]="isOwner()"
        [showBenutzername]="true"
        [mustShowPassword]="false"
        (valid)="updateUserValid($event)"
      ></lxt-user>
    </div>
    <div class="col-6" [hidden]="isUserDirty()">
      <lxt-role
        [currentUser]="currentUser"
        [isVereinsAnmelder]="isVereinsAnmelder"
        [isVereinsVerantwortlicher]="isVereinsVerantwortlicher"
        [(assignedRoles)]="assignedRoles"
      >
      </lxt-role>
      <lxt-wertungsrichter
        *ngIf="isWertungsrichter()"
        [currentUser]="currentUser"
        [(wertungsrichter)]="wertungsrichter"
        [isVereinsAnmelder]="isVereinsAnmelder"
        [isVereinsVerantwortlicher]="isVereinsVerantwortlicher"
      >
      </lxt-wertungsrichter>
    </div>
  </div>
</div>
