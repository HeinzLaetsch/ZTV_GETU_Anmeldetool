<button mat-icon-button class="close-button" type="button" (click)="onCancelClick()">
  <mat-icon class="close-icon" color="warn">close</mat-icon>
</button>
<div class="minimal">
  <h1 mat-dialog-title>{{ dialogTitle() }}</h1>
</div>
<form [formGroup]="teilnehmerForm" mat-dialog-content>
  <h2>Teilnehmer</h2>
  <div>
    <mat-form-field>
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" />
    </mat-form-field>
  </div>
  <div>
    <mat-form-field>
      <mat-label>Vorname</mat-label>
      <input matInput formControlName="vorname" />
    </mat-form-field>
  </div>
  <div>
    <mat-form-field>
      <mat-label>Jahrgang</mat-label>
      <input matInput type="number" formControlName="jahrgang" />
    </mat-form-field>
  </div>
  <div>
    <mat-form-field>
      <mat-label>Turnerin/Turner {{ teilnehmerForm.controls.tiTu.value }}</mat-label>
      <select matNativeControl formControlName="tiTu">
        <option value="Ti">Turnerin</option>
        <option value="Tu">Turner</option>
      </select>
    </mat-form-field>
  </div>
  <div>
    <mat-form-field>
      <mat-label>STV Nummer</mat-label>
      <input matInput formControlName="stvNummer" />
    </mat-form-field>
  </div>
  <div mat-dialog-actions>
    <button mat-button type="button" (click)="onCancelClick()">Abbrechen</button>
    <button mat-button type="button" (click)="onSaveClick()" cdkFocusInitial>
      {{ dialogActionButton() }}
    </button>
  </div>
</form>
