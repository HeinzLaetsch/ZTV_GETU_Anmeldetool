<h1>ZTV Anlässe</h1>
<hr />
@if (anlaesseSig()) {
  <div class="layout-row">
    @if (showEvents()) {
      <div class="layout-row">
        @for (anlass of anlaesseExtended(); track anlass.anlass.id) {
          <div class="layout-col-md-auto">
            <lxt-event-thumbnail #thumbnail [anlassExtended]="anlass"></lxt-event-thumbnail>
          </div>
        }
      </div>
    }
  </div>
} @else {
  <div class="center">
    <mat-spinner style="margin: 0 auto"></mat-spinner>
  </div>
}
